<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Ton Nom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="contact-page">
    <a href="index.html" class="close-btn">✕</a>

    <form action="https://api.staticforms.dev/submit" method="POST" class="contact-form">
      <input type="hidden" name="apiKey" value="sf_b116aa16dd0073f82ff5bf64">
      <input type="hidden" name="redirectTo" value="https://loicpidoux.github.io/photo/merci.html">
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" required>

      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="6" required></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </main>
</body>
</html>
